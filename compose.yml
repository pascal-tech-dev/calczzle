# Production stack: nginx frontend + Go API.
# Host ports use 90xx so they do not clash with Dev Containers (5173 / 8080).
# Browser → http://localhost:9091 → nginx → /api/* → backend:8080 (Compose network)

name: calczzle

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9090:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "9091:80"
    depends_on:
      - backend
    restart: unless-stopped
